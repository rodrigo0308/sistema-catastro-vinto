<div class="app-layout">
    <!-- Capa Superior Independiente (Header Principal) -->
    <header class="top-header">
        <div class="brand-section">
            <h1 class="brand-title">GAMV VINTO</h1>
            <span class="brand-divider">|</span>
            <span class="brand-subtitle">Sistema Web de Recaudación y Catastro</span>
        </div>
    </header>

    <!-- Área Principal (Menú Lateral + Contenido) -->
    <div class="dashboard-body">
        <!-- Panel Lateral Izquierdo (Menú Interactivo) -->
        <aside class="sidebar" [class.collapsed]="isCollapsed">

            <!-- Control de Menú -->
            <div class="sidebar-header">
                <button class="toggle-btn" (click)="toggleSidebar()" title="Alternar menú">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18" />
                    </svg>
                </button>
                <span class="menu-label" *ngIf="!isCollapsed">Panel de Control</span>
            </div>

            <!-- Navegación con Íconos -->
            <nav class="sidebar-nav">
                <a routerLink="/dashboard/catastro" routerLinkActive="active" class="nav-item"
                    title="Módulo de Catastro">
                    <span class="icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                            <line x1="8" y1="2" x2="8" y2="18"></line>
                            <line x1="16" y1="6" x2="16" y2="22"></line>
                        </svg>
                    </span>
                    <span class="label" *ngIf="!isCollapsed">Módulo de Catastro</span>
                </a>

                <a routerLink="/dashboard/recaudacion" routerLinkActive="active" class="nav-item"
                    title="Módulo Tributario">
                    <span class="icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                            <line x1="8" y1="6" x2="16" y2="6"></line>
                            <line x1="16" y1="14" x2="16" y2="18"></line>
                            <path d="M16 10h.01"></path>
                            <path d="M12 10h.01"></path>
                            <path d="M8 10h.01"></path>
                            <path d="M12 14h.01"></path>
                            <path d="M8 14h.01"></path>
                            <path d="M12 18h.01"></path>
                            <path d="M8 18h.01"></path>
                        </svg>
                    </span>
                    <span class="label" *ngIf="!isCollapsed">Módulo Tributario</span>
                </a>
            </nav>

            <!-- Botón de Cierre de Sesión en la Parte Inferior -->
            <div class="sidebar-footer">
                <button class="btn-logout" (click)="cerrarSesion()" title="Cerrar Sesión">
                    <span class="icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </span>
                    <span class="label" *ngIf="!isCollapsed">Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- Contenido Dinámico (Geovisor / Recaudaciones) -->
        <main class="main-content">
            <div class="content-body">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
