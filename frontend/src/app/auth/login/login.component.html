<div class="login-container">
    <div class="login-card">
    <div class="header">
        <h2>GAM Vinto</h2>
        <p>Sistema de Catastro y Recaudación</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
        <div class="input-group">
        <label for="usuario">Nombre de Usuario</label>
        <input id="usuario" type="text" formControlName="nombreUsuario" placeholder="Ej. admin">
        </div>

        <div class="input-group">
        <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="contrasena" placeholder="Tu contraseña secreta">
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="btn-login">
        Ingresar al Sistema
        </button>
    </form>
    </div>
</div>
